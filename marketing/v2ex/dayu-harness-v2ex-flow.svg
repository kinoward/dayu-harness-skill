<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dayu Harness Skill flow</title>
  <desc id="desc">A Harness Engineering flow showing scattered project rules becoming repository governance assets and feedback loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#163342"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .card-title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .card-body { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bae6fd; }
      .caption { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f0fdfa; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="40" y="40" width="1200" height="640" rx="28" fill="#0b1220" opacity="0.58" stroke="#334155"/>

  <text x="80" y="108" class="title">Dayu Harness Skill</text>
  <text x="80" y="146" class="subtitle">把一次性的 AI 协作提示，沉淀成仓库里可审查、可检查、可迁移的治理体系</text>

  <g filter="url(#shadow)">
    <rect x="82" y="214" width="292" height="236" rx="20" fill="#111827" stroke="#475569"/>
    <rect x="494" y="214" width="292" height="236" rx="20" fill="#0f2f3c" stroke="#0ea5e9"/>
    <rect x="906" y="214" width="292" height="236" rx="20" fill="#10251f" stroke="#10b981"/>
  </g>

  <text x="118" y="266" class="card-title">输入：零散规则</text>
  <text x="118" y="310" class="card-body">聊天记录</text>
  <text x="118" y="345" class="card-body">PR 评论</text>
  <text x="118" y="380" class="card-body">口头约定</text>
  <text x="118" y="415" class="card-body">旧文档与排障经验</text>

  <text x="530" y="266" class="card-title">处理：Skill 融合</text>
  <text x="530" y="310" class="card-body">分析项目现状</text>
  <text x="530" y="345" class="card-body">生成 dry-run / merge plan</text>
  <text x="530" y="380" class="card-body">保留、替换、合并或跳过</text>
  <text x="530" y="415" class="card-body">部署治理骨架</text>

  <text x="942" y="266" class="card-title">输出：仓库治理</text>
  <text x="942" y="310" class="card-body">AGENTS.md 项目地图</text>
  <text x="942" y="345" class="card-body">docs/harness 指南</text>
  <text x="942" y="380" class="card-body">hooks / CI / sensors</text>
  <text x="942" y="415" class="card-body">ADR、排障、研究资料</text>

  <path d="M 394 332 C 420 332, 448 332, 472 332" stroke="#7dd3fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 806 332 C 832 332, 860 332, 884 332" stroke="#7dd3fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="154" y="520" width="972" height="92" rx="18" fill="#082f49" stroke="#0ea5e9"/>
    <text x="190" y="557" class="caption">长期反馈回路</text>
    <text x="190" y="590" class="small">Agent 读取项目地图 -> 执行任务 -> 脚本检查结果 -> 经验回写 docs 与 AGENTS.md</text>
  </g>

  <path d="M 1004 520 C 1004 488, 1004 482, 1004 458" stroke="#34d399" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 276 520 C 276 488, 276 482, 276 458" stroke="#34d399" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="626" width="360" height="30" rx="15" fill="url(#accent)" opacity="0.2"/>
  <text x="98" y="648" class="small">Project-centric, not Agent-centric</text>
</svg>
