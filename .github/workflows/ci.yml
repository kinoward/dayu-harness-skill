name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --test-reporter=spec
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: TMPDIR=.tmp BATS_TMPDIR=.tmp bats tests/unit/test-architecture-contracts.bats
      - run: npm run build
