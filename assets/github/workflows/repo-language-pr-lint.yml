name: Repository Language PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-language-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title for CJK characters
        run: |
          TITLE="$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
          contains_cjk() {
            perl -Mutf8 -e 'binmode STDIN, ":encoding(UTF-8)"; local $/; exit(<STDIN> =~ /[\x{4E00}-\x{9FFF}\x{3040}-\x{309F}\x{30A0}-\x{30FF}\x{AC00}-\x{D7AF}\x{3000}-\x{303F}\x{FF00}-\x{FFEF}]/ ? 0 : 1);'
          }
          if printf '%s\n' "$TITLE" | contains_cjk; then
            echo "ERROR: PR title contains CJK characters. Use English."
            echo "See docs/harness/guides/git-language-policy.md"
            exit 1
          fi

      - name: Check PR body for CJK characters
        run: |
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          contains_cjk() {
            perl -Mutf8 -e 'binmode STDIN, ":encoding(UTF-8)"; local $/; exit(<STDIN> =~ /[\x{4E00}-\x{9FFF}\x{3040}-\x{309F}\x{30A0}-\x{30FF}\x{AC00}-\x{D7AF}\x{3000}-\x{303F}\x{FF00}-\x{FFEF}]/ ? 0 : 1);'
          }
          if echo "$BODY" | grep -q '<!-- skip-cjk-check -->'; then
            echo "SKIP: PR body contains <!-- skip-cjk-check --> marker."
            exit 0
          fi
          if printf '%s\n' "$BODY" | contains_cjk; then
            echo "ERROR: PR body contains CJK characters. Use English."
            echo "See docs/harness/guides/git-language-policy.md"
            exit 1
          fi
