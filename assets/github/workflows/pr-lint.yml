name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect release-please PR
        id: detect-release-please
        run: |
          HEAD_REF="$(jq -r '.pull_request.head.ref // ""' "$GITHUB_EVENT_PATH")"
          AUTHOR="$(jq -r '.pull_request.user.login // ""' "$GITHUB_EVENT_PATH")"
          LABELS="$(jq -r '[.pull_request.labels[]?.name] | join("\n")' "$GITHUB_EVENT_PATH")"

          SKIP="false"
          if [ "${HEAD_REF#release-please--}" != "$HEAD_REF" ]; then
            SKIP="true"
          elif [ "$AUTHOR" = "github-actions[bot]" ] && printf '%s\n' "$LABELS" | grep -Eq '^autorelease:'; then
            SKIP="true"
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Check PR body structure
        id: pr-body-structure
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          if [ -z "$BODY" ]; then
            echo "ERROR: PR body is empty. Provide a body that follows the PR template."
            exit 1
          fi
          printf '%s\n' "$BODY" | python3 .github/scripts/pr_body_structure.py

      - name: Aggregate lint results
        if: always()
        run: |
          FAILED=""
          if [ "${{ steps.detect-release-please.outputs.skip }}" != "true" ] && [ "${{ steps.pr-body-structure.outcome }}" != "success" ]; then
            FAILED="$FAILED pr-body-structure"
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::The following PR lint checks failed:$FAILED"
            exit 1
          fi
