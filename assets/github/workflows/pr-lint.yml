name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted base for validators
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect release-please PR
        id: detect-release-please
        env:
          RELEASE_PLEASE_POLICY_PATH: trusted/.github/release-please-policy.json
          RELEASE_PLEASE_CONFIG_PATH: trusted/release-please-config.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ERROR: GITHUB_TOKEN is required to inspect PR commit/files metadata."
            exit 1
          fi

          PAYLOAD_PATH="$GITHUB_EVENT_PATH"
          REPO="$(jq -r '.repository.full_name // empty' "$PAYLOAD_PATH")"
          PR_NUMBER="$(jq -r '.pull_request.number // empty' "$PAYLOAD_PATH")"

          FILES_OUTPUT="${RUNNER_TEMP}/pr-lint-files.json"
          COMMITS_OUTPUT="${RUNNER_TEMP}/pr-lint-commits.json"

          if ! RESULT="$(python3 - "$PAYLOAD_PATH" "$REPO" "$PR_NUMBER" "$RELEASE_PLEASE_POLICY_PATH" "$RELEASE_PLEASE_CONFIG_PATH" "$GITHUB_TOKEN" "$FILES_OUTPUT" "$COMMITS_OUTPUT" <<'PY'
          import datetime
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.request

          payload_path, repo, pr_number, policy_path, config_path, token, files_output, commits_output = sys.argv[1:9]

          PR_NUMBER = str(pr_number).strip()
          if not PR_NUMBER.isdigit():
              print(f"skip=false", end="")
              raise SystemExit(0)

          def load_json(path):
              with open(path, encoding="utf-8") as file_obj:
                  return json.load(file_obj)

          def read_payload(path):
              with open(path, encoding="utf-8") as file_obj:
                  return json.load(file_obj)

          def fetch_json(url, headers):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = response.read().decode("utf-8")
              return json.loads(payload)

          def fetch_pages(base_url, headers):
              page = 1
              while True:
                  data = fetch_json(f"{base_url}?per_page=100&page={page}", headers)
                  if not isinstance(data, list):
                      raise RuntimeError(f"unexpected API response for {base_url}")
                  if not data:
                      break
                  for item in data:
                      yield item
                  if len(data) < 100:
                      break
                  page += 1

          def load_release_policy(path, root_policy):
              if not os.path.exists(path):
                  return {}
              data = load_json(path)
              if not isinstance(data, dict):
                  return {}
              release_pr = data.get("release_pr")
              if isinstance(release_pr, dict):
                  return release_pr
              if root_policy:
                  return root_policy
              return {}

          def load_release_config(path):
              if not os.path.exists(path):
                  return {}
              data = load_json(path)
              if isinstance(data, dict):
                  return data
              return {}

          def parse_title_pattern(raw_pattern):
              if not isinstance(raw_pattern, str) or not raw_pattern.strip():
                  return None
              escaped = re.escape(raw_pattern.strip())
              escaped = escaped.replace(r"\$\{version\}", r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?")
              return re.compile(f"^{escaped}$")

          def normalize_actor(value):
              return (value or "").strip().lower()

          def is_release_actor(author):
              return normalize_actor(author) in {
                  "github-actions[bot]",
                  "release-please[bot]",
              }

          def parse_epoch(raw):
              if not raw:
                  return 0
              try:
                  return int(datetime.datetime.fromisoformat(str(raw).replace("Z", "+00:00")).timestamp())
              except Exception:
                  try:
                      return int(raw)
                  except Exception:
                      return 0

          def is_allowed_file(filename, patterns):
              return any(
                  fnmatch.fnmatch(filename, pattern)
                  for pattern in patterns
                  if isinstance(pattern, str) and pattern.strip()
              )

          def touched_file_paths(item):
              paths = []
              filename = item.get("filename")
              if isinstance(filename, str) and filename:
                  paths.append(filename)
              previous_filename = item.get("previous_filename")
              if isinstance(previous_filename, str) and previous_filename:
                  paths.append(previous_filename)
              return paths

          payload = read_payload(payload_path)
          pull_request = payload.get("pull_request") if isinstance(payload, dict) else None
          if not isinstance(pull_request, dict):
              print("skip=false", end="")
              raise SystemExit(0)

          head_ref = str(pull_request.get("head", {}).get("ref", "") or "")
          title = str(pull_request.get("title", "") or "").strip()
          base_ref = str((pull_request.get("base") or {}).get("ref", "") or "")
          default_branch = str((payload.get("repository") or {}).get("default_branch", "") or "")
          author = str((pull_request.get("user") or {}).get("login", "") or "")
          head_repo = str((pull_request.get("head", {}).get("repo") or {}).get("full_name", "") or "")
          repo_full_name = str((payload.get("repository") or {}).get("full_name", "") or "")

          base_policy = load_release_policy(policy_path, {})
          config = load_release_config(config_path)

          branch_prefix = base_policy.get("branch_prefix", "release-please--")
          if not isinstance(branch_prefix, str) or not branch_prefix.strip():
              branch_prefix = "release-please--"

          title_pattern = base_policy.get("title_pattern", "")
          if not isinstance(title_pattern, str) or not title_pattern.strip():
              title_pattern = (
                  config.get("pull-request-title-pattern")
                  or "Release ${version}"
              )

          allowed_paths = base_policy.get("allowed_paths", [])
          if not isinstance(allowed_paths, list):
              allowed_paths = []

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "dayu-harness-pr-lint",
          }

          pr_files = []
          for item in fetch_pages(
              f"https://api.github.com/repos/{repo}/pulls/{PR_NUMBER}/files",
              headers,
          ):
              if not isinstance(item, dict):
                  continue
              filename = item.get("filename")
              if not isinstance(filename, str) or not filename:
                  continue

              record = {
                  "filename": filename,
                  "status": str(item.get("status", "") or ""),
              }
              previous_filename = item.get("previous_filename")
              if isinstance(previous_filename, str) and previous_filename:
                  record["previous_filename"] = previous_filename
              pr_files.append(record)

          commit_records = []
          for item in fetch_pages(
              f"https://api.github.com/repos/{repo}/pulls/{PR_NUMBER}/commits",
              headers,
          ):
              if not isinstance(item, dict):
                  continue
              sha = item.get("sha")
              if not isinstance(sha, str):
                  continue

              commit_files = []
              try:
                  detail = fetch_json(
                      f"https://api.github.com/repos/{repo}/commits/{sha}",
                      headers,
                  )
                  detail_files = detail.get("files", []) if isinstance(detail, dict) else []
                  for detail_file in detail_files:
                      if not isinstance(detail_file, dict):
                          continue
                      detail_filename = detail_file.get("filename")
                      if isinstance(detail_filename, str) and detail_filename:
                          commit_files.append(
                              {
                                  "filename": detail_filename,
                                  "status": str(detail_file.get("status", "") or ""),
                              }
                          )
              except Exception:
                  commit_files = []

              commit_payload = {
                  "sha": sha,
                  "subject": str((item.get("commit") or {}).get("message", "") or ""),
                  "message": str((item.get("commit") or {}).get("message", "") or ""),
                  "committed_at": parse_epoch(
                      (item.get("commit") or {}).get("author", {}).get("date")
                      or (item.get("commit") or {}).get("committer", {}).get("date")
                  ),
                  "files": commit_files,
              }
              commit_records.append(commit_payload)

          title_re = parse_title_pattern(title_pattern)
          title_matches = bool(title_re and title_re.fullmatch(title))
          files_allowed = bool(allowed_paths)
          disallowed_paths = []
          for item in pr_files:
              for path in touched_file_paths(item):
                  if not is_allowed_file(path, allowed_paths):
                      files_allowed = False
                      disallowed_paths.append(path)
                      break

              if not files_allowed and disallowed_paths:
                  break

          if disallowed_paths:
              limit = ", ".join(disallowed_paths[:6])
              print(f"DEBUG: release-please PR has disallowed files: {limit}", file=sys.stderr)

          release_shape_ok = (
              bool(head_ref.startswith(branch_prefix))
              and is_release_actor(author)
              and bool(base_ref and default_branch and base_ref == default_branch)
              and bool(head_repo and repo_full_name and head_repo == repo_full_name)
              and bool(title_matches)
              and bool(allowed_paths)
              and bool(files_allowed)
          )

          with open(files_output, "w", encoding="utf-8") as file_obj:
              json.dump(pr_files, file_obj, ensure_ascii=False, indent=2)

          with open(commits_output, "w", encoding="utf-8") as file_obj:
              json.dump(commit_records, file_obj, ensure_ascii=False, indent=2)

          print(f"skip={'true' if release_shape_ok else 'false'}", end="")
          PY
          )"; then
            echo "ERROR: failed to detect release-please PR shape."
            exit 1
          fi

          SKIP="${RESULT#skip=}"
          [ "$SKIP" = "true" ] || SKIP="false"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "files_path=$FILES_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "commits_path=$COMMITS_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Check PR title
        id: pr-title
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          title = (payload.get("pull_request", {}).get("title") or "").strip()

          if not title:
            print("ERROR: PR title is empty.", file=sys.stderr)
            raise SystemExit(1)
          if len(title) < 5:
            print("ERROR: PR title must be at least 5 characters.", file=sys.stderr)
            raise SystemExit(1)

          print("OK: PR title length check passed.")
          PY

      - name: Check PR body structure
        id: pr-body-structure
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REPO="$(jq -r '.repository.full_name // empty' "$GITHUB_EVENT_PATH")"
          PR_NUMBER="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | python3 trusted/.github/scripts/pr_body_structure.py --repo "$REPO" --pr-number "$PR_NUMBER"

      - name: Fetch PR files and commits
        id: fetch-pr-metadata
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -eu

          files_path="${{ steps.detect-release-please.outputs.files_path }}"
          commits_path="${{ steps.detect-release-please.outputs.commits_path }}"

          if [ "$files_path" != "$RUNNER_TEMP/pr-lint-files.json" ]; then
            cp "$files_path" "$RUNNER_TEMP/pr-lint-files.json"
          fi

          if [ "$commits_path" != "$RUNNER_TEMP/pr-lint-commits.json" ]; then
            cp "$commits_path" "$RUNNER_TEMP/pr-lint-commits.json"
          fi

          echo "files_path=$RUNNER_TEMP/pr-lint-files.json" >> "$GITHUB_OUTPUT"
          echo "commits_path=$RUNNER_TEMP/pr-lint-commits.json" >> "$GITHUB_OUTPUT"

      - name: Detect candidate policy files in PR
        id: candidate-policy-files
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          files_json="${{ steps.fetch-pr-metadata.outputs.files_path }}"
          if [ ! -f "$files_json" ]; then
            echo "release_policy_candidate=false" >> "$GITHUB_OUTPUT"
            echo "tdd_policy_candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$files_json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          files_json = Path(sys.argv[1])
          output_path = Path(sys.argv[2])

          try:
              files = json.loads(files_json.read_text(encoding="utf-8"))
              if not isinstance(files, list):
                  files = []
          except Exception:
              files = []

          def was_candidate_touched(filename: str) -> bool:
              for item in files:
                  if not isinstance(item, dict):
                      continue
                  if item.get("filename") != filename and item.get(
                      "previous_filename"
                  ) != filename:
                      continue
                  return True
              return False

          release_policy_candidate = (
              was_candidate_touched(".github/release-please-policy.json")
              or was_candidate_touched(".github/scripts/release_please_policy.py")
          )
          tdd_policy_candidate = was_candidate_touched(".github/dayu-harness/pr-tdd-policy.json")

          with output_path.open("a", encoding="utf-8") as output_file:
              output_file.write(f"release_policy_candidate={str(release_policy_candidate).lower()}\n")
              output_file.write(f"tdd_policy_candidate={str(tdd_policy_candidate).lower()}\n")
          PY

      - name: Check sub-commit issue trailers
        id: sub-commit-trailers
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if [ ! -f "${{ steps.fetch-pr-metadata.outputs.commits_path }}" ]; then
            echo "ERROR: Missing fetched PR commit metadata. PR commit check skipped/failed."
            exit 1
          fi

          python3 - "${{ steps.fetch-pr-metadata.outputs.commits_path }}" <<'PY'
          import json
          import re
          import sys

          commits_path = sys.argv[1]
          commits = json.loads(open(commits_path, encoding="utf-8").read())

          forbidden_re = re.compile(r"\b(?:close(?:s|d)?|fix(?:es|ed)?|resolve(?:s|d)?|refs)\s+#\d+", re.IGNORECASE)
          bad = []
          for item in commits:
            message = (
                item.get("subject")
                or item.get("message")
                or (item.get("commit", {}).get("message") or "")
            ).strip()
            sha = item.get("sha", "")
            if forbidden_re.search(message):
              bad.append((sha, message.splitlines()[0] if message else ""))

          if bad:
            lines = ["ERROR: Sub-commit messages must not include issue trailers for Close/Closed, Fix/Fixed, Resolve/Resolved or Refs."]
            lines.append("Offending commits:")
            lines.extend(f"  {sha} {first_line}" for sha, first_line in bad)
            print("\n".join(lines), file=sys.stderr)
            raise SystemExit(1)

          print("OK: Sub-commit trailers check passed.")
          PY

      - name: Check troubleshooting entry updates
        id: troubleshooting-sync
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if [ ! -f "${{ steps.fetch-pr-metadata.outputs.files_path }}" ]; then
            echo "ERROR: Missing fetched PR files metadata. Troubleshooting check skipped/failed."
            exit 1
          fi

          python3 - "${{ steps.fetch-pr-metadata.outputs.files_path }}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          files = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          changed_agents = set()
          changed_entries = []
          bad_entries = []

          def record_troubleshooting_entry(path: str, status: str) -> None:
            if not re.fullmatch(r"docs/troubleshooting/[^/]+/[^/]+\.md", path):
              return
            if path.endswith("/AGENTS.md"):
              return
            category = path.split("/")[2]
            entry_still_exists = status not in ("removed", "deleted")
            changed_entries.append((path, category, entry_still_exists))

          for item in files:
            filename = item.get("filename", "")
            status = (item.get("status") or "").lower()
            previous_filename = item.get("previous_filename", "")

            if not filename and not previous_filename:
              continue

            if isinstance(filename, str) and re.fullmatch(r"docs/troubleshooting/[^/]+/AGENTS\.md", filename):
              category = filename.split("/")[2]
              changed_agents.add(category)

            if isinstance(previous_filename, str) and re.fullmatch(r"docs/troubleshooting/[^/]+/AGENTS\.md", previous_filename):
              category = previous_filename.split("/")[2]
              changed_agents.add(category)

            if isinstance(filename, str):
              record_troubleshooting_entry(filename, status)

            if isinstance(previous_filename, str) and previous_filename:
              record_troubleshooting_entry(previous_filename, "deleted")

          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          def extract_agent_markdown_targets(content: str) -> set[str]:
              targets: set[str] = set()
              for match in link_pattern.finditer(content):
                  target = match.group(1).strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if target.startswith("<") and target.endswith(">"):
                      target = target[1:-1].strip()
                  target = target.split("#", 1)[0].strip()
                  target = target.split("?", 1)[0].strip()
                  if not target:
                      continue
                  normalized = os.path.normpath(target.replace("\\", "/"))
                  normalized = normalized.lstrip("./")
                  normalized = normalized.replace("\\", "/")
                  targets.add(normalized)
              return targets

          for entry_path, category, entry_still_exists in changed_entries:
            expected_agents = Path(f"docs/troubleshooting/{category}/AGENTS.md")
            if category not in changed_agents:
              bad_entries.append(f"Missing synchronized AGENTS update: {expected_agents.as_posix()}")
              continue

            expected_agents_file = Path("pr") / expected_agents
            if not expected_agents_file.exists():
              bad_entries.append(f"Troubleshooting AGENTS index file is missing: {expected_agents.as_posix()}")
              continue

            agent_links = extract_agent_markdown_targets(
                expected_agents_file.read_text(encoding="utf-8")
            )
            entry_name = Path(entry_path).name
            is_referenced = (
                entry_path in agent_links
                or entry_name in agent_links
                or any(link.endswith(f"/{entry_name}") for link in agent_links)
            )

            if entry_still_exists:
              entry_file = Path("pr") / entry_path
              if not entry_file.exists():
                bad_entries.append(f"Cannot read troubleshooting entry file: {entry_path}")
                continue

              first_twenty = [line.strip() for line in entry_file.read_text(encoding="utf-8").splitlines()[:20]]
              if "## TL;DR" not in first_twenty:
                bad_entries.append(f"Troubleshooting entry must include '## TL;DR' within first 20 lines: {entry_path}")
                continue

              if not is_referenced:
                bad_entries.append(
                  f"Troubleshooting entry must be referenced in {expected_agents.as_posix()} as a Markdown link: {entry_path}"
                )
            elif is_referenced:
              bad_entries.append(
                f"Troubleshooting AGENTS index must remove deleted entry reference: {entry_path}"
              )

          if bad_entries:
            print("ERROR: Troubleshooting index/tldr checks failed.", file=sys.stderr)
            for item in bad_entries:
              print(f"- {item}", file=sys.stderr)
            raise SystemExit(1)

          if changed_entries:
            print("OK: Troubleshooting entry updates include synchronized AGENTS and TL;DR in first 20 lines.")
          else:
            print("OK: No troubleshooting entry updates detected.")
          PY

      - name: Optional release policy check
        id: release-policy
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        env:
          RELEASE_POLICY_SCRIPT_PATH: trusted/.github/scripts/release_please_policy.py
          RELEASE_POLICY_POLICY_PATH: trusted/.github/release-please-policy.json
        run: |
          if [ "${{ steps.candidate-policy-files.outputs.release_policy_candidate }}" = "true" ]; then
            if [ ! -f "pr/.github/scripts/release_please_policy.py" ]; then
              echo "ERROR: PR candidate release policy script path missing: pr/.github/scripts/release_please_policy.py"
              exit 1
            fi
            python3 -m py_compile "pr/.github/scripts/release_please_policy.py"
            if [ ! -f "pr/.github/release-please-policy.json" ]; then
              echo "ERROR: PR candidate release policy path missing: pr/.github/release-please-policy.json"
              exit 1
            fi
          fi

          if [ -f "$RELEASE_POLICY_SCRIPT_PATH" ] && [ -f "$RELEASE_POLICY_POLICY_PATH" ]; then
            python3 "$RELEASE_POLICY_SCRIPT_PATH" "$RELEASE_POLICY_POLICY_PATH" "pr"
            if [ "${{ steps.candidate-policy-files.outputs.release_policy_candidate }}" = "true" ]; then
              python3 "$RELEASE_POLICY_SCRIPT_PATH" "pr/.github/release-please-policy.json" "pr"
            fi
          else
            echo "Skipping optional release policy check (missing script or policy): $RELEASE_POLICY_SCRIPT_PATH / $RELEASE_POLICY_POLICY_PATH"
            if [ "${{ steps.candidate-policy-files.outputs.release_policy_candidate }}" = "true" ]; then
              python3 "pr/.github/scripts/release_please_policy.py" "pr/.github/release-please-policy.json" "pr"
            fi
          fi

      - name: Optional TDD policy check
        id: tdd-policy
        if: steps.detect-release-please.outputs.skip != 'true'
        continue-on-error: true
        env:
          TDD_CHECK_SCRIPT_PATH: trusted/.github/scripts/pr_tdd_check.py
          TDD_CHECK_POLICY_PATH: trusted/.github/dayu-harness/pr-tdd-policy.json
        run: |
          if [ -f "$TDD_CHECK_SCRIPT_PATH" ] && [ -f "$TDD_CHECK_POLICY_PATH" ]; then
            python3 "$TDD_CHECK_SCRIPT_PATH" \
              "$TDD_CHECK_POLICY_PATH" \
              --files-json "${{ steps.fetch-pr-metadata.outputs.files_path }}" \
              --commits-json "${{ steps.fetch-pr-metadata.outputs.commits_path }}" \
              --repo-root "pr"
            if [ "${{ steps.candidate-policy-files.outputs.tdd_policy_candidate }}" = "true" ]; then
              if [ -f "pr/.github/dayu-harness/pr-tdd-policy.json" ]; then
                python3 "$TDD_CHECK_SCRIPT_PATH" \
                  "pr/.github/dayu-harness/pr-tdd-policy.json" \
                  --validate-policy-only
              else
                echo "ERROR: PR candidate TDD policy path missing: pr/.github/dayu-harness/pr-tdd-policy.json"
                exit 1
              fi
            fi
          else
            echo "Skipping optional TDD policy check (missing script or policy): $TDD_CHECK_SCRIPT_PATH / $TDD_CHECK_POLICY_PATH"
          fi

      - name: Aggregate lint results
        if: always()
        run: |
          if [ "${{ steps.detect-release-please.outputs.skip }}" = "true" ]; then
            echo "PR lint checks skipped for release-please branch."
            exit 0
          fi

          FAILED=()
          if [ "${{ steps.pr-title.outcome }}" != "success" ]; then
            FAILED+=("pr-title")
          fi
          if [ "${{ steps.pr-body-structure.outcome }}" != "success" ]; then
            FAILED+=("pr-body-structure")
          fi
          if [ "${{ steps.fetch-pr-metadata.outcome }}" != "success" ]; then
            FAILED+=("pr-metadata")
          fi
          if [ "${{ steps.sub-commit-trailers.outcome }}" != "success" ]; then
            FAILED+=("sub-commit-trailers")
          fi
          if [ "${{ steps.troubleshooting-sync.outcome }}" != "success" ]; then
            FAILED+=("troubleshooting-sync")
          fi
          if [ "${{ steps.release-policy.outcome }}" != "success" ]; then
            FAILED+=("release-policy")
          fi
          if [ "${{ steps.tdd-policy.outcome }}" != "success" ]; then
            FAILED+=("tdd-policy")
          fi

          if [ "${#FAILED[@]}" -ne 0 ]; then
            echo "::error::PR lint failed: ${FAILED[*]}"
            exit 1
          fi
          echo "OK: All required PR lint gates passed."
